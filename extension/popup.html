<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FinPilot</title>
  <style>
    * { box-sizing: border-box; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { width: 360px; margin: 0; color: #0f172a; font-size: 13px; }
    header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #e2e8f0; }
    .logo { width: 30px; height: 30px; border-radius: 9px; background: #0f766e; color: #fff; display: grid; place-items: center; font-weight: 800; }
    .who { margin-left: auto; text-align: right; font-size: 11px; color: #64748b; }
    section { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #64748b; margin: 0 0 8px; }
    label { display: block; font-size: 12px; color: #475569; margin-bottom: 8px; }
    input { width: 100%; border: 1px solid #cbd5e1; border-radius: 9px; padding: 7px 9px; font-size: 13px; margin-top: 3px; }
    .row { display: flex; gap: 8px; }
    button { background: #0f766e; color: #fff; border: none; border-radius: 9px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
    button.sec { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; font-weight: 500; }
    .demo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .demo button { padding: 7px 4px; font-size: 12px; }
    .muted { color: #64748b; font-size: 11px; line-height: 1.4; }
    .answer { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: #f8fafc; white-space: pre-line; }
    .err { color: #b91c1c; font-size: 12px; margin-top: 6px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="logo">F</div>
    <div><b>FinPilot</b><div class="muted">Buy now, or not worth it?</div></div>
    <div class="who" id="who"></div>
  </header>

  <div id="signed-out" hidden>
    <section>
      <h2>Log in to your family room</h2>
      <form id="login">
        <label>Email<input id="email" type="email" required></label>
        <label>Password<input id="password" type="password" required></label>
        <button style="width:100%">Log in</button>
      </form>
      <div class="err" id="login-err"></div>
    </section>
    <section>
      <h2>Or use the demo family</h2>
      <div class="demo"><button class="sec" data-demo="alex">Alex</button><button class="sec" data-demo="sam">Sam</button><button class="sec" data-demo="maya">Maya</button><button class="sec" data-demo="leo">Leo</button></div>
    </section>
  </div>

  <div id="signed-in" hidden>
    <section>
      <h2>This page</h2>
      <label>Product<input id="title"></label>
      <label>Price, USD<input id="price" type="number" min="0" step="0.01"></label>
      <div class="row"><button id="check" style="flex:1">Is it worth it?</button><button class="sec" id="open">Open FinPilot</button></div>
      <p class="muted" id="found"></p>
    </section>
    <section>
      <h2>Ask FinPilot</h2>
      <form id="chat" class="row"><input id="q" placeholder="What bills are coming up?"><button>Ask</button></form>
      <div class="answer" id="answer" hidden></div>
    </section>
  </div>

  <section>
    <h2>Settings</h2>
    <label>FinPilot address<input id="api" placeholder="http://localhost:8000"></label>
    <div class="row"><button class="sec" id="save">Save</button><button class="sec" id="logout" hidden>Log out</button></div>
    <p class="muted">Only the product name, price and link are sent, and only to your own FinPilot. Prototype, not financial advice.</p>
  </section>
  <script src="popup.js"></script>
</body>
</html>
